<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #0056b3;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
        }

        .container h2 {
            color: #0056b3;
            margin-bottom: 20px;
        }

        form {
            margin: 0;
        }

        form button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        form button:hover {
            background-color: #0056b3;
        }

        .container p {
            font-size: 16px;
            line-height: 1.6;
            margin-top: 20px;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #0056b3;
            color: white;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>ՕՆլայն Դպրոց</h1>
    </header>

    <div class="container">
        <h2>Մուտք</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Մուտք</button>
        </form>
        <p>Գրանցված չե՞ք <a href="{% url 'register' %}">Գրանցվել</a></p>
    </div>

    <footer>
        <p>&copy; 2024 ՕՆլայն դպրոց: Բոլոր իրավունքները պաշտպանված են։</p>
    </footer>
</body>
</html>
